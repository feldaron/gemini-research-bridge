name: Temporary verify fixed UI setup

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8d80c1b7472260af6cb83bfae12c7d5a
      BRIDGE_URL: https://gemini-research-bridge.laptopvalue.co.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token=${token#Bearer }
          token=${token#\"}; token=${token%\"}
          token=${token#\'}; token=${token%\'}
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Wait for production Worker
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "$BRIDGE_URL/health" >/dev/null; then
              sleep 5
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Ensure clean synthetic setup state
        run: npx wrangler d1 execute gemini-research-bridge --remote --command "DELETE FROM app_settings WHERE key='ui_auth';"
      - name: Create synthetic password and session
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D setup.headers -o setup.body -c cookies.txt \
            -X POST "$BRIDGE_URL/ui/setup" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'password=synthetic-test-password-12345' \
            --data-urlencode 'confirm=synthetic-test-password-12345'
          status=$(awk 'NR==1 {print $2}' setup.headers)
          echo "setup_status=$status"
          test "$status" = "303"
          grep -qi '^location: /' setup.headers
          grep -qi '^set-cookie: grb_ui=' setup.headers
      - name: Verify stored hash metadata
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute gemini-research-bridge --remote --json --command \
            "SELECT json_extract(value,'$.iterations') AS iterations, length(json_extract(value,'$.hash')) AS hash_length FROM app_settings WHERE key='ui_auth';" > auth.json
          cat auth.json
          jq -e '.[0].results[0].iterations == 100000 and .[0].results[0].hash_length == 64' auth.json >/dev/null
      - name: Verify authenticated dashboard and Antigravity screen
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -b cookies.txt "$BRIDGE_URL/" -o dashboard.html
          grep -q 'New research task' dashboard.html
          curl -fsS -b cookies.txt "$BRIDGE_URL/ui/agent" -o agent.html
          grep -q 'Antigravity agent' agent.html
          grep -q 'Google authentication' agent.html
      - name: Clean synthetic setup state
        if: always()
        run: npx wrangler d1 execute gemini-research-bridge --remote --command "DELETE FROM app_settings WHERE key='ui_auth';"
