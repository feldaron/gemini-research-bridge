name: Temporary offline JSON smoke test

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8d80c1b7472260af6cb83bfae12c7d5a
      CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
      BRIDGE_URL: https://gemini-research-bridge.laptopvalue.co.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token=${token#Bearer }
          token=${token#\"}; token=${token%\"}
          token=${token#\'}; token=${token%\'}
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Submit job for offline export
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          key="offline-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg key "$key" '{task:"Offline JSON smoke test. Return unresolved without external research.", context:{purpose:"offline smoke"}, request_key:$key, max_attempts:1, priority:100}' > request.json
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLIENT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$BRIDGE_URL/v1/research" \
            --data @request.json > submitted.json
          job_id=$(jq -r '.job.id' submitted.json)
          test -n "$job_id" && test "$job_id" != "null"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Download self-contained offline research bundle
        id: export
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{limit:1, lease_seconds:3600, researcher:"offline-smoke-model"}' > export-request.json
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLIENT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$BRIDGE_URL/v1/offline/export" \
            --data @export-request.json > bundle.json
          cat bundle.json
          test "$(jq -r '.format' bundle.json)" = "gemini-research-bridge.offline-jobs.v1"
          test "$(jq -r '.jobs | length' bundle.json)" = "1"
          test "$(jq -r '.jobs[0].job_id' bundle.json)" = '${{ steps.submit.outputs.job_id }}'
          jq -e '.instructions | length > 20' bundle.json >/dev/null
          jq -e '.response_format.output_mode == "json_only"' bundle.json >/dev/null
          jq -e '.response_format.top_level_format == "gemini-research-bridge.offline-proposals.v1"' bundle.json >/dev/null
          jq -e '.response_format.example.proposals[0].result.resolution == "unresolved"' bundle.json >/dev/null
          batch_id=$(jq -r '.batch_id' bundle.json)
          claim_token=$(jq -r '.jobs[0].claim_token' bundle.json)
          echo "batch_id=$batch_id" >> "$GITHUB_OUTPUT"
          echo "claim_token=$claim_token" >> "$GITHUB_OUTPUT"

      - name: Upload model-style offline JSON response
        id: import
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg batch '${{ steps.export.outputs.batch_id }}' \
            --arg job '${{ steps.submit.outputs.job_id }}' \
            --arg token '${{ steps.export.outputs.claim_token }}' \
            '{format:"gemini-research-bridge.offline-proposals.v1", batch_id:$batch, researcher:"offline-smoke-model", proposals:[{job_id:$job, claim_token:$token, result:{resolution:"unresolved", proposed_value:null, evidence:[], reasoning:"Intentional offline protocol smoke test.", confidence:"low", conflicts:[], research_notes:"Synthetic offline response."}}]}' > returned.json
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLIENT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$BRIDGE_URL/v1/offline/import" \
            --data @returned.json > imported.json
          cat imported.json
          proposal_id=$(jq -r '.imported[0].proposal_id' imported.json)
          test -n "$proposal_id" && test "$proposal_id" != "null"
          test "$(jq -r '.imported[0].review_status' imported.json)" = "pending"
          echo "proposal_id=$proposal_id" >> "$GITHUB_OUTPUT"

      - name: Verify pending proposal and review it
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -H "Authorization: Bearer $CLIENT_TOKEN" \
            "$BRIDGE_URL/v1/proposals?review_status=pending&limit=100" > pending.json
          jq -e --arg id '${{ steps.import.outputs.proposal_id }}' '.proposals | any(.proposal.id == $id)' pending.json >/dev/null
          jq -n '{decision:"rejected", reviewer:"offline-smoke", notes:"Synthetic offline smoke result."}' > review.json
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLIENT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$BRIDGE_URL/v1/proposals/${{ steps.import.outputs.proposal_id }}/review" \
            --data @review.json > reviewed.json
          test "$(jq -r '.proposal.review_status' reviewed.json)" = "rejected"

      - name: Remove synthetic offline smoke-test row
        if: always() && steps.submit.outputs.job_id != ''
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute gemini-research-bridge --remote \
            --command "DELETE FROM jobs WHERE id = '${{ steps.submit.outputs.job_id }}';"
