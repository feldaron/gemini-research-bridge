name: Temporary check Gemini API key

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Confirm secret exists and Google accepts it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is missing or empty"
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1')
          echo "google_status=${status}"
          if [ "$status" != "200" ]; then
            jq '{error: .error}' response.json || cat response.json
            exit 1
          fi
          echo "GEMINI_API_KEY is present and accepted by Google"
