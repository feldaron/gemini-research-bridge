name: Temporary check Gemini API key

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Confirm normalized secret is accepted by Google
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is missing or empty"
            exit 1
          fi
          key=$(printf '%s' "$GEMINI_API_KEY" | tr -d '\r\n')
          key="${key#\"}"; key="${key%\"}"
          key="${key#\'}"; key="${key%\'}"
          if [ -z "$key" ]; then
            echo "GEMINI_API_KEY becomes empty after normalization"
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "x-goog-api-key: ${key}" \
            'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1')
          echo "google_status=${status}"
          if [ "$status" != "200" ]; then
            jq '{error: {code: .error.code, status: .error.status, message: .error.message}}' response.json || true
            exit 1
          fi
          echo "GEMINI_API_KEY is present and accepted by Google after safe normalization"
