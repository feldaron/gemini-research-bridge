name: Temporary verify updated Gemini API key

on:
  push:
    paths:
      - '.github/workflows/tmp-check-updated-gemini-key.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Verify Google accepts the configured key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY is missing or empty'; exit 1; }
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1')
          echo "google_status=${status}"
          if [ "$status" != "200" ]; then
            jq '{error:{code:.error.code,status:.error.status,message:.error.message}}' response.json || true
            exit 1
          fi
          echo 'GEMINI_API_KEY is present and accepted by Google.'
