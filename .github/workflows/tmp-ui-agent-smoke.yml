name: Temporary UI agent smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8d80c1b7472260af6cb83bfae12c7d5a
      BRIDGE_URL: https://gemini-research-bridge.laptopvalue.co.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token=${token#Bearer }
          token=${token#\"}; token=${token%\"}
          token=${token#\'}; token=${token%\'}
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Inspect dashboard settings without values
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute gemini-research-bridge --remote --command "SELECT key, length(value) AS value_length FROM app_settings WHERE key IN ('ui_auth','gemini_api_key') ORDER BY key;"
      - name: Verify setup and agent routes
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D setup.headers -o setup.body "$BRIDGE_URL/ui/setup"
          status=$(awk 'NR==1 {print $2}' setup.headers)
          echo "setup_status=$status"
          if [ "$status" = "200" ]; then
            grep -q "New UI password" setup.body
            ! grep -q "Controller token" setup.body
          elif [ "$status" = "303" ]; then
            grep -qi '^location: /' setup.headers
          else
            cat setup.headers
            cat setup.body
            exit 1
          fi

          curl -sS -D agent.headers -o agent.body "$BRIDGE_URL/ui/agent"
          agent_status=$(awk 'NR==1 {print $2}' agent.headers)
          echo "agent_status=$agent_status"
          test "$agent_status" = "303"
          grep -qi '^location: /' agent.headers

          curl -fsS "$BRIDGE_URL/health" | jq -e '.antigravity_agent == "antigravity-preview-05-2026"' >/dev/null
