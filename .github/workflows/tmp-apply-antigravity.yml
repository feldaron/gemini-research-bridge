name: Temporary clean mailbox smoke test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8d80c1b7472260af6cb83bfae12c7d5a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token=${token#Bearer }
          token=${token#\"}; token=${token%\"}
          token=${token#\'}; token=${token%\'}
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Remove synthetic mailbox job
        run: npx wrangler d1 execute gemini-research-bridge --remote --command "DELETE FROM jobs WHERE id = '4add32a6-c0ef-4051-afb5-39e267767ecd';"
