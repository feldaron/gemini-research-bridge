name: Temporary apply Antigravity migration

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8d80c1b7472260af6cb83bfae12c7d5a
      BRIDGE_URL: https://gemini-research-bridge.laptopvalue.co.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token=${token#Bearer }
          token=${token#\"}; token=${token%\"}
          token=${token#\'}; token=${token%\'}
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Apply migrations
        run: npx wrangler d1 migrations apply gemini-research-bridge --remote
      - name: Wait for Antigravity deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS "$BRIDGE_URL/health" > health.json || true
            if jq -e '.cloud_antigravity != null and .antigravity_agent == "antigravity-preview-05-2026"' health.json >/dev/null 2>&1; then
              cat health.json
              exit 0
            fi
            sleep 3
          done
          cat health.json || true
          exit 1
