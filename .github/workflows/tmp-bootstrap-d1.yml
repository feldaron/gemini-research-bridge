name: Temporary D1 bootstrap

on:
  push:
    branches: [main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8d80c1b7472260af6cb83bfae12c7d5a
    steps:
      - name: Diagnose D1 authorization
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token=${token#Bearer }
          token=${token#\"}; token=${token%\"}
          token=${token#\'}; token=${token%\'}

          verify_code=$(curl -sS -o verify.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "token_verify_http=${verify_code}"
          jq '{success, errors}' verify.json

          d1_code=$(curl -sS -o d1.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=gemini-research-bridge&per_page=100")
          echo "d1_http=${d1_code}"
          jq '{success, errors, messages}' d1.json

          if [ "$d1_code" != "200" ]; then exit 1; fi
