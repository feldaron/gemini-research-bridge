name: Temporary bridge audit

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8d80c1b7472260af6cb83bfae12c7d5a
      CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
      WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token=${token#Bearer }
          token=${token#\"}; token=${token%\"}
          token=${token#\'}; token=${token%\'}
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Install bridge secrets when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLIENT_TOKEN:-}" ]; then
            printf '%s' "$CLIENT_TOKEN" | npx wrangler secret put CLIENT_TOKEN
            echo "client_token_present=true"
          else
            echo "client_token_present=false"
          fi
          if [ -n "${WORKER_TOKEN:-}" ]; then
            printf '%s' "$WORKER_TOKEN" | npx wrangler secret put WORKER_TOKEN
            echo "worker_token_present=true"
          else
            echo "worker_token_present=false"
          fi
      - name: Inspect Worker account and bindings
        shell: bash
        run: |
          set -euo pipefail
          subdomain=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")
          echo "workers_subdomain=$(printf '%s' "$subdomain" | jq -r '.result.subdomain // empty')"

          settings=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/gemini-research-bridge/settings")
          printf '%s' "$settings" | jq '{bindings: [.result.bindings[]? | {name, type, id}]}'
