name: Temporary verify UI key health state

on:
  push:
    paths:
      - '.github/workflows/tmp-health-ui-key.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://gemini-research-bridge.laptopvalue.co.uk/health | tee health.json
          jq -e '.cloud_antigravity == true' health.json >/dev/null
          jq -r '"cloud_antigravity=\(.cloud_antigravity) agent=\(.antigravity_agent)"' health.json
